version: '3.5'

services:
  frontend:
    build:
      dockerfile: Frontend.Dockerfile
    container_name: vibes-frontend
    ports:
      - '3000:3000'
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    ports:
      - '1433:1433'
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: yourStrong(!)Password
